name: LHM Intelligence Bot

# Robô autônomo da LHM. Roda na nuvem do GitHub (internet liberada),
# puxa dados reais e entrega no Telegram. Funciona com o PC desligado.
#
# Horários em UTC (Brasília = UTC-3):
#   0 11 * * *  -> 08:00 BRT, todo dia   (Briefing Matinal)
#   0 10 * * 1  -> 07:00 BRT, segunda    (Radar de Cidades & Concorrência)
#   0 20 * * 5  -> 17:00 BRT, sexta      (Raio-X de Performance)

on:
  schedule:
    - cron: "0 11 * * *"
    - cron: "0 10 * * 1"
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo para teste manual (briefing, radar ou raiox)"
        default: "briefing"

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Definir o modo conforme o horário
        id: mode
        run: |
          MODE="briefing"
          case "${{ github.event.schedule }}" in
            "0 10 * * 1") MODE="radar" ;;
            "0 20 * * 5") MODE="raiox" ;;
          esac
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo selecionado: $MODE"

      - name: Rodar o LHM Intelligence Bot
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WINDSOR_KEY_ADS: ${{ secrets.WINDSOR_KEY_ADS }}
          WINDSOR_KEY_GA: ${{ secrets.WINDSOR_KEY_GA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node automacao/lhm-bot.mjs
