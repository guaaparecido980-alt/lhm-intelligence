name: LHM Intelligence Bot

# Robô autônomo da LHM. Roda na nuvem do GitHub (internet liberada),
# puxa dados reais e entrega no Telegram. Funciona com o PC desligado.
#
# Horários em UTC (Brasília = UTC-3):
#   9 11 * * *  -> 08:09 BRT, todo dia   (Briefing Matinal)
#   9 10 * * 1  -> 07:09 BRT, segunda    (Radar de Cidades & Concorrência)
#   9 13 * * 3  -> 10:09 BRT, quarta     (Raio-X de Palavras-Chave / SEO)
#   9 20 * * 5  -> 17:09 BRT, sexta      (Raio-X de Performance)
#   9 21 * * 0  -> 18:09 BRT, domingo    (Direcao da Semana / Chefe consolidador)
# IMPORTANTE: minuto fora do ":00" de propósito. O GitHub atrasa/descarta
# tarefas agendadas que caem na "hora cheia" (todo mundo agenda 0 min). Sair
# do :00 reduz muito a chance de o agendamento não rodar.

on:
  schedule:
    - cron: "9 11 * * *"
    - cron: "9 10 * * 1"
    - cron: "9 13 * * 3"
    - cron: "9 20 * * 5"
    - cron: "9 21 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo manual: briefing, radar, seo, raiox ou chefe"
        default: "briefing"

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Definir o modo conforme o horário
        id: mode
        run: |
          MODE="briefing"
          case "${{ github.event.schedule }}" in
            "9 10 * * 1") MODE="radar" ;;
            "9 13 * * 3") MODE="seo" ;;
            "9 20 * * 5") MODE="raiox" ;;
            "9 21 * * 0") MODE="chefe" ;;
          esac
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Modo selecionado: $MODE"

      - name: Rodar o LHM Intelligence Bot
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          CHANNEL: "telegram"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WINDSOR_KEY_ADS: ${{ secrets.WINDSOR_KEY_ADS }}
          WINDSOR_KEY_GA: ${{ secrets.WINDSOR_KEY_GA }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node automacao/lhm-bot.mjs

      # 🚨 Monitor de saúde: se qualquer passo acima falhar, avisa no Telegram
      # com o link direto pro erro. Só dispara em caso de falha.
      - name: Avisar no Telegram se algo falhar
        if: failure()
        run: |
          curl -sS -m 30 -G "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🚨 LHM Intelligence: a rotina (${{ steps.mode.outputs.mode }}) FALHOU hoje e NÃO foi entregue. Veja o erro aqui: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
